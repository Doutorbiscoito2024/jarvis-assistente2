<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18"><link rel="manifest" href="manifest.json">
<title>J.A.R.V.I.S. 2.0</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header><div class="orb"><span></span></div><div><h1>J.A.R.V.I.S.</h1><p>ASSISTENTE PESSOAL · 2.0</p></div><div id="status" class="status">LOCAL</div></header>
  <section class="visual"><div class="ring r1"></div><div class="ring r2"></div><div class="core">J</div><p id="state">SISTEMA PRONTO</p></section>
  <section class="chat" id="chat" aria-live="polite"><div class="msg bot">Olá. Sou o JARVIS. Posso fazer cálculos, responder comandos locais e conversar por voz. A IA generativa ainda não está conectada nesta versão.</div></section>
  <form id="form"><input id="prompt" autocomplete="off" placeholder="Digite uma mensagem..." aria-label="Mensagem"><button type="submit">ENVIAR</button></form>
  <div class="controls"><button id="mic" class="secondary">🎙 FALAR</button><button id="speak" class="secondary">🔊 VOZ: LIGADA</button><button id="clear" class="secondary">LIMPAR</button></div>
  <footer>JARVIS 2.0 · Permissões locais e limitadas</footer>
</main>
<script src="app.js"></script>
</body></html>
